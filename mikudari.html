* { box-sizing: border-box; }
body {

body::before {

}
.wrap { max-width: 1040px; margin-inline: auto; }
header { margin-bottom: 18px; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;

.layout { display: flex; flex-direction: column; gap: 20px; }
.stage {

}

  display: grid;
  grid-template-columns: minmax(96px, 34%) minmax(0, 1fr);
  grid-template-areas: "fig head" "fig rows";
  grid-template-rows: auto 1fr;

}
.head { grid-area: head; min-width: 0; }
.fig { grid-area: fig; min-width: 0; }
.rows-wrap { grid-area: rows; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.idx { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }

  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);

}

}
#fig { width: 100%; height: auto; display: block; }

.zone.R { --c: var(--right); }
.zone.L { --c: var(--left); }

.zone.aux .ring { stroke-dasharray: 3 3.5; stroke-width: 1.4; opacity: 0.9; }
.zone .num { fill: var(--bg); font: 700 10px var(--font-body); text-anchor: middle; dominant-baseline: central; }

@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes breathe { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: no-preference) {

.rows li.aux .sw.L { color: var(--left); }

.verse { display: grid; grid-template-columns: 2.9rem minmax(0, 1fr); gap: 10px; align-items: start; }
.vl { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--muted); padding-top: 8px; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.chip {

  font-size: 17px;
  line-height: 1.3;
  min-height: 44px;
  padding: 6px 11px 5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 1px solid var(--line);

  color: var(--ink);

}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.none { border-style: dashed; color: var(--muted); }
.chip.none[aria-pressed="true"] { color: var(--bg); }
.dots { display: flex; gap: 3px; height: 4px; }
.dots i { width: 12px; height: 4px; border-radius: 2px; display: block; }
.dots .R { background: var(--right); }
.dots .L { background: var(--left); }
.dots .B { background: var(--both); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--left); outline-offset: 2px; }

@media (min-width: 820px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 390px); gap: 36px; align-items: start; }
  .stage { order: 0; grid-column: 2; grid-row: 1; top: 16px; max-height: calc(100vh - 32px); padding: 16px; }

  .fig { max-width: 210px; width: 100%; margin-inline: auto; }
  h2.now { font-size: 36px; }
  .chip { font-size: 19px; }
}
</style>

<script>
const RAW_DEFS = `#予備動作
##「合掌の手」
両平手の掌を向かい合わせに軽くつけて、胸の前に立てる

##「イサミの手」
まず、右平手は掌を下向きに、左平手は掌を上向きにして、肩の高さまで上げ、次に、その両平手を腹の脇前まで下げながら掌を返して、前の反対にして、再び肩の高さまで上げる。

##「オサエの手」
両平手の掌を下向きにして、腹の前あたりで、平らに揃える。

##「平らに揃える手」
両平手の掌を上向きにして、胸の前あたりで、小指と小指とを三，四寸離して揃える。。この場合は、そのところで特に説明する。

##「たすけの手」
まず、両平手の掌を内向きにして、頬の前辺りに上げるや、

##「回りの手」
左平手で右袂を軽く押さえ、右平手は掌を外向きにして、左頬の斜め前下あたりに上げる。

##「口許を指す手」
左平手で右袂を軽く押さえ、右人差指は掌を内向きにして、口許を指す。

##「右耳を指す手」
左平手で右袂を軽く押さえ、右人差指は掌を内向きにして、右耳を指す。

##「平らに円を描く手」
両人差指の甲を上向きにし、左指先を少し重ね、腹の前方に突き出すや、直ちに左右に離して、平に円を描き、甲を左右外向きにして、腹のすぐ前に両親指を軽くつけて揃える。

`;
const RAW_CHAPTER = `#三下り目

##一ツ
両扇で「合掌の手」（図右）足は左を踏む。（備考…以下「二ツ」「三ツ」等の場合は、特に説明する以外は、いずれもこれに準ずること）
###ひのもと
合掌の扇を左右に開きながら、少し前方からすくい気味で下ろし、腹の前あたりから、両扇を上向きにし、両扇の端を三分の一ほど右を上にして重ね、平らに揃えて、肩の高さまで上げる（図左）。足は、左で調子を取って腰を心持ち落とし、右を踏んで腰を伸ばす。
###しよやしきの
両平手の掌を内向きに、両扇を立てて、その端を三分の一ほど右を内側にして重ねるや（これを便宜上「立て扇」と称す＝図）、右腹前、左腹前、右腹前と少し動かす。足は、右左と二歩進み、右を揃える。
###つとめの
両扇で「合掌の手」足は左を踏む。
###ばしよハ
両平手の甲を下向きにし、両扇を向かい合わせにして、その先を三分の一ほど右を上に重ねて、腹の前に出すや（図）、直ちに両扇を左右に離し、その先を正面向きにしながら、平らに円を描いて、そのまま両扇の端を三分の一ほど重ねて、肩の高さに上げる（図）。足は、右を一歩出して、元に戻す。
###よのもとや
右腹前、左腹前、右腹前と三回「立て扇」（図）足は、右左と二歩退り、右を揃える。
##二ツ
両扇で「合掌の手」足は、左を半歩出す。
###ふしぎなァ
両扇で（回りの手）（図）足は、「回りの足」（その二）の要領で、身体をその場所で右に一回りさす（ただし、「ァ」の時、右足を踏む）。
###つとめ
両扇で「合掌の手」足は、左を踏む。
###ばしよハ
手足ともに、一ツの「ばしょハ」と同じ動作。すなわち、両平手の甲を下向きにし、両扇を向かい合わせにして、その先を三分の一ほど右を上に重ねて、腹の前に出すや（図）、直ちに両扇を左右に離し、その先を正面向きにしながら、平らに円を描いて、そのまま両扇の端を三分の一ほど重ねて、肩の高さに上げる（図）。足は、右を一歩出して、元に戻す。
###たれに
右腹前に一回「立て扇」（図）足は、右を一歩進む。
###たのみは
両扇を合わせて、腹の前あたりから（図）おもむろに上げて、合掌の型に立てる。足は、左を一歩進み、右を揃える。
###かけねども
右腹前、左腹前、右腹前と三回「立て扇」（図）足は、右左と二歩退り、右を揃える。
##三ッ
###みな
手足ともに、一ツの「ひのもと」と同じ動作。すなわち、合掌の扇（図右）を左右に開きながら、少し前方からすくい気味で下ろし、腹の前あたりから、両掌を上向きにし、腹の前あたりから、両掌を上向きにし、両扇の端を三分の一ほど右を上向きにして重ね、平らに揃えて、肩の高さまで上げる（図左）。足は、左で調子を取って腰を心持ち落とし、右を踏んで腰を伸ばす。
###せかいが
右腹前、左腹前と二回「立て扇」（図）足は右左と二歩進む。
###よりあうて
なお続いて、右腹前、左腹前、右腹前と三回「立て扇」（図）足は、右をなお半歩ほど前に出し、身体の重量を、右左右と三回前後に移す（この間、足を踏まずに、軽く調子を取る程度にする）。
###でけたち、きたるが
両平手の甲を上向きにし、両扇を向かい合わせにして、その先を三分の一ほど右を下に平らに重ねて、額の高さに上げるや（図）、直ちに両扇を左右に離し上下に円を描いて、胸下の前あたりから掌を上向きにし、右扇を上に三分の一ほど重ねて、肩の高さまで上げる。（図）。足は「でけ」の時、右に身体の重量を託して調子を取り、「たち」の時、左を踏み揃え、「きた」の時、右で調子をとって、腰をほんの少し屈め、「るが」の時、左で調子をとって、腰を伸ばす。
###これふしぎ
右腹前、左腹前、右腹前と三回「立て扇」（図）足は、右左と二歩退り、右を揃える。
##四ッ
###よう／＼
手足ともに、一ツの「ひのもと」と同じ動作。すなわち、合掌の扇を左右に開きながら、少し前方からすくい気味で下ろし、腹の前あたりから、両扇を上向きにし、両扇の端を三分の一ほど右を上にして重ね、平らに揃えて、肩の高さまで上げる（図左）。足は左で調子をとって腰を心持ち落とし、右を踏んで腰を伸ばす。
###こゝまで、つい
右腹前、左腹前、右腹前と三回「立て扇」（図）足は、右左と二歩進み、右を揃える。
###て
両扇をそのまま、掌を前向きにして、腹の前に倒す（図右）。足は、左を踏む。
###きた
倒した両扇を胸にとる（両扇は左を前にしてほとんど全部が合わさるぐらいにする＝図左）。足は、右を踏む。
###じつの
両扇で「オサエの手」、すなわち甲を上向きにして、右扇を上にして、その端を三分の一ほど重ねて、平らに揃える（図）
###たすけハ
両扇をそのまま額の前まで上げつつ、その先を向かい合わせにするや（図右）、直ちに、上下に円を描いて、肩の高さまで上げる（図左）。（備考…三ツの「できたち、きたるが」と同じ要領なるも、動作は幾分早くすること。また、円の描き始めは右扇が上になっている）足は、右左と踏む。
###これからや
右腹前、左腹前、右腹前と三回「立て扇」（図）足は、右左と二歩退り、右を揃える。
##五ッ
###いつも
手足ともに、一ツの「ひのもと」と同じ動作。すなわち合掌の扇（図右）を左右に開きながら、少し前方からすくい気味で下ろし、腹の前あたりから、両扇を上向きにし、両扇の端を三分の一ほど右を上にして重ね、平らに揃えて、肩の高さまで上げる（図左）。足は、左で調子を取って腰を心持ち落とし、右を踏んで腰を伸ばす。
###わらはれ
右腹前、左腹前と二回「立て扇」（図）足は、右左と二歩進む。
###そしられて
両扇で、右より四回「ナゲの手」（図）足は、右を揃え、左右左と踏む。
###めづらし、たすけを
両扇は、三ツの「でけたち、きたるが」と同じ動作。すなわち、両平手の甲を上向きにし、両扇を向かい合わせにして、その先を三分の一ほど右を下に平らに重ねて、額の高さに上げるや（図右）、直ちに両扇を左右に離し上下に円を描いて、胸下の前あたりから掌を上向きにし、右扇を上に三分の一ほど重ねて、肩の高さまで上げる（図左）。足は、右左右と踏む。
###するほどに
右腹前、左腹前、右腹前と三回「立て扇」（図）足は、右左と二歩退り、右を揃える
##六ッ
###むりな
「オサエの手」足は、右を踏む。
###ねがひは
「合掌の手」足は、左右と二歩進む。
###してくれな
左より四回「フリの手」足は、左を揃え、右左右と踏む。
###ひとすぢ
左平手で右たもとを軽く押さえ、右人差指は甲を外向きにして、左腰あたりに下げるや（図右）、直ちに、甲を内向きに指先を立てて、右目の斜め前あたりに上げる（図左）。足は右を踏む。
###ごゝろに
両平手の指先を、右左と胸にとる。足は、右左と踏む。
###なりてこい
右より四回「ナゲの手」足は、右左と二歩退り、右を揃え、左を踏む。
##七ッ
###なんでも
「オサエの手」足は、右を踏む。
###これから
二回「イサミの手」足は、右左と二歩進む。
###ひとすぢに
身体を少し斜め左向きにし、左平手で、右たもとを軽く押さえ、右人差指は甲を外向きにして、左腰の前あたりに下げるや（図右）、また直ちに、身体を正面向きにし、右人差指をおもむろに上げて、右目の斜め前辺りに、甲を内向きに指先を立てる（図左）。足は、右を左の前より、手の動作につれて、おもむろに半歩出す。
###かみに
「合掌の手」足は前のままとする。
###もたれて
合掌の手を、右耳の下辺りに持っていくと同時に（図右）、頭を右に傾けて、それにもたれるようにしながら、身体を左回りに後ろ向きに半回りさす（図左）。足は、前の位置のままで、両かかとを中心にして爪先を左回りに後ろ向きに回す。（図①）
###ゆきまする
三回「イサミの手」足は、右左と後ろ向きに二歩進み（ただし、左は少し斜め右向きとする）、次に、左の爪先で正面向きとなり、右を揃える（図②③④⑤）。
##八ッ
###やむほど
左平手で右たもとを軽く押さえ、右平手の甲を上向きに、指先を後ろ向きにして、右耳の下あたりに持っていき、頭を右方に少し傾けて、手枕する型をゆっくりする（図）。足は、右を左の前に踏む。
###つらい
つらいー両平手は掌を内向きにして、おおかた袖口に入れ、指先で袖口を軽く握り（図右①）、左を前にして両袖先を重ね合わせて（図右②）、みぞおちのあたりに軽く当てるとともに（図左）、上半身は少し下向き気味となる。右左と二歩進む。
###ことハない
右より四回「ナゲの手」足は、右を揃え、左右左と踏む。
###わしも
両平手の指先を、同時に胸にとる。足は、右を踏む。
###これから
両平手の掌を後ろ向きにして、頭の後ろから手首を軽く回して、頭にハチマキをする格好をすると同時に、掌を前向きに指先を軽く握り、額の前で、両拳を互いに小さく一回りさしてハチマキを結ぶ格好をし、そのまま左右に引き分ける（図①②③）。足は左右と踏む。
###ひのきしん
まず、両平手を軽く握り、右拳は右肩のところに上げ、左拳は左腰の脇に垂れ（図）、次に、なお三回、左右の拳を上下反対にする。足は、右左と後ろ向きに二歩退り、右を半ば鉤型に踏み、左を正面向きに揃えるとほとんど同時に、右もまた正面向きとなる（図①②③④⑤）。
##九ッ
###こゝまで
「オサエの手」足は、右を踏む
###しん／＼”
「合掌の手」足は、左右と二歩進む。
###したけれど
左より四回「ナゲの手」足は、左を揃え、右左右と踏む。
###もとの
「オサエの手」足は、左を踏む。
###かみとハ
「合掌の手」足は、右左と踏む。
###しらなんだ
右より四回「フリの手」足は、右左と二歩退り、右を揃え、左を踏む。
##十ド
###このたび
二回「イサミの手」足は、右左と二歩進む。
###あらはれた
両人差指で、腹前に「平らに円を描く手」足は、右を一歩出し、手の動作につれて、半分ほど退く（図①②）。
###じつの
「オサエの手」足は、左を半歩出して揃える（図③）。
###かみには
「合掌の手」足は、右左と踏む。
###さうゐない
右より四回「ナゲの手」足は、右左と二歩退り、右を揃え、左を踏む。

  const defs = {};

    } else if (/^#/.test(line)) {

      cur.text += line.trim();

    '<ellipse class="glow" cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" filter="url(#glow)"/>' +
    '<ellipse class="ring" cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"/>';
  if (it.flip === 'flipXL') s += flipMark(cx, cy - 43, 11, 37);
  else if (it.flip === 'flipTall') s += flipMark(cx, cy - 26, 11, 29);
  else if (it.flip) s += flipMark(cx, cy - 9, 10, 20);
  if (it.up) s += moveArrow(cx, cy, ZONES[it.up][0], ZONES[it.up][1]);
  if (it.steps.length) s += badge(cx, cy, it.steps.slice().sort().join('・'));
  return s + '</g>';
}
function refsHtml(text) {
  return esc(text).replace(/「([^」]+)」/g, (m, n) =>
    DATA.defs[n] ? '<span class="ref">「' + n + '」</span>' : m);
}
function select(i) {
  if (i < 0 || i >= L.length) return;
  cur = i;
  const l = L[i];
  $('#idx').textContent = (i + 1) + ' / ' + L.length;
  $('#now').textContent = l.name;
  const shown = l.items.filter(it => it.h !== 'A');
  const ordered = [...shown.filter(it => !isAux(it)), ...shown.filter(isAux)];
  $('#zones').innerHTML = [...l.items.filter(isAux), ...l.items.filter(it => !isAux(it))].map(zoneSvg).join('');
  $('#rows').innerHTML = ordered.length
    ? ordered.map(it =>
        '<li' + (isAux(it) ? ' class="aux"' : '') + '><span class="sw ' + it.h + '"></span><span class="who">' + HAND[it.h] + '</span>' +
        '<span>' + esc(ZONES[it.z][4]) + '</span><span class="stp">' +
        (isAux(it) ? '補助動作' : (it.steps.length ? esc(it.steps.slice().sort().join('・')) + '番目' : '') + (it.flip ? '・手を返す' : '') + (it.up ? '・上へ' : '')) + '</span></li>').join('')
    : '<li class="empty">この歌詞に、位置を指す記述はありません。</li>';
  $('#desc').innerHTML = refsHtml(l.hand);
  const names = [...new Set((l.hand.match(/「([^」]+)」/g) || []).map(s => s.slice(1, -1)))].filter(n => DATA.defs[n]);
  $('#defs').innerHTML = names.map(n => '<li><b>「' + esc(n) + '」</b> ' + esc(defText(DATA.defs[n].text)) + '</li>').join('');
  document.querySelectorAll('.chip').forEach((c, k) => c.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
  syncStageHeight();
}
function syncStageHeight() {
  const h = mqWide.matches ? 0 : stage.offsetHeight;
  document.documentElement.style.setProperty('--stage-h', h + 'px');
}
/* 名前を出さない節。このページでは全部出すので空 */
const HIDDEN_LABELS = [];
function buildList() {
  const wrap = $('#verses');
  const groups = [];
  L.forEach((l, k) => {
    const g = groups[groups.length - 1];
    if (g && g.name === l.section) g.idx.push(k); else groups.push({ name: l.section, idx: [k] });
  });
  groups.forEach(g => {
    const row = document.createElement('section');
    row.className = 'verse';
    row.innerHTML = '<div class="vl">' + (HIDDEN_LABELS.includes(g.name) ? '' : esc(g.name)) + '</div><div class="chips"></div>';
    const chips = row.querySelector('.chips');
    g.idx.forEach(i => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (L[i].items.length ? '' : ' none');
      b.setAttribute('aria-pressed', 'false');
      const hands = ['R', 'L', 'B'].filter(h => L[i].items.some(it => it.h === h && !isAux(it)));
      b.innerHTML = '<span>' + esc(L[i].name) + '</span><span class="dots">' + hands.map(h => '<i class="' + h + '"></i>').join('') + '</span>';
      b.addEventListener('click', () => select(i));
      chips.appendChild(b);
    });
    wrap.appendChild(row);
  });
}
function step(d) {
  const n = Math.min(L.length - 1, Math.max(0, cur + d));
  select(n);
  const chip = document.querySelectorAll('.chip')[n];
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  chip.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
}
buildList();
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
});
window.addEventListener('resize', syncStageHeight);
select(0);
</script>
<script src="menu.js"></script>
</body>
