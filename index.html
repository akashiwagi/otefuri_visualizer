}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a22;
    --surface: #16242f;
    --ink: #e6edf1;

* { box-sizing: border-box; }
body {

  color: var(--ink);
  font-family: var(--font-body);

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);

}
.wrap { max-width: 1040px; margin-inline: auto; }
header { margin-bottom: 18px; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;

.layout { display: flex; flex-direction: column; gap: 20px; }
.stage {

  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;

  overflow: auto;
}
.stage-body {
  display: grid;
  grid-template-columns: minmax(96px, 34%) minmax(0, 1fr);
  grid-template-areas: "fig head" "fig rows";
  grid-template-rows: auto 1fr;
  column-gap: 12px;
  row-gap: 8px;
}
.head { grid-area: head; min-width: 0; }
.fig { grid-area: fig; min-width: 0; }
.rows-wrap { grid-area: rows; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.idx { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
.nav { display: flex; gap: 6px; }

  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}
.nav button:hover { border-color: var(--muted); }

h2.now {

  font-weight: 700;
  font-size: 30px;
  line-height: 1.25;
  margin: 2px 0 0;

}
#fig { width: 100%; height: auto; display: block; }
#fig .guide { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 5; }
#fig .gl, #fig .side { fill: var(--muted); font: 500 10px var(--font-body); }
#fig .gl { text-anchor: end; }

.zone.R { --c: var(--right); }
.zone.L { --c: var(--left); }
.zone.B { --c: var(--both); }
.zone .glow { fill: var(--c); opacity: 0.8; }

.zone .flip { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
.zone .flipHead { fill: var(--ink); }
.zone.aux .glow { opacity: 0.28; animation: none; }
.zone.aux .ring { stroke-dasharray: 3 3.5; stroke-width: 1.4; opacity: 0.9; }
.zone .num { fill: var(--bg); font: 700 10px var(--font-body); text-anchor: middle; dominant-baseline: central; }
.zone { animation: appear 0.28s ease-out both; }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes breathe { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: no-preference) {
  .zone .glow { animation: breathe 2.6s ease-in-out infinite; }
}
@media (prefers-reduced-motion: reduce) {
  .zone { animation: none; }
}

.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

.sw.R { background: var(--right); }
.sw.L { background: var(--left); }

.rows li.aux { color: var(--muted); }
.rows li.aux .sw { background: none; border: 2px dashed currentColor; width: 12px; height: 12px; }

.rows li.aux .sw.L { color: var(--left); }
.rows li.aux .sw.B { color: var(--both); }

.who { font-weight: 700; font-size: 12px; letter-spacing: 0.04em; }
.stp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { margin: 0; color: var(--muted); font-size: 14px; }

.notes { grid-column: 1 / -1; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.notes h3 { margin: 0; font-weight: 700; font-size: 13px; }

.ref { border-bottom: 2px solid var(--left); font-weight: 500; }

.verses { display: grid; gap: 16px; }

.vl { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--muted); padding-top: 8px; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.chip {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 17px;
  line-height: 1.3;
  min-height: 44px;
  padding: 6px 11px 5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  scroll-margin-top: calc(var(--stage-h, 0px) + 12px);
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.none { border-style: dashed; color: var(--muted); }
.chip.none[aria-pressed="true"] { color: var(--bg); }
.dots { display: flex; gap: 3px; height: 4px; }
.dots i { width: 12px; height: 4px; border-radius: 2px; display: block; }
.dots .R { background: var(--right); }
.dots .L { background: var(--left); }
.dots .B { background: var(--both); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--left); outline-offset: 2px; }

@media (min-width: 820px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 390px); gap: 36px; align-items: start; }
  .stage { order: 0; grid-column: 2; grid-row: 1; top: 16px; max-height: calc(100vh - 32px); padding: 16px; }
  .verses { grid-column: 1; grid-row: 1; }
  .stage-body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "fig" "rows"; grid-template-rows: auto; row-gap: 12px; }
  .fig { max-width: 210px; width: 100%; margin-inline: auto; }
  h2.now { font-size: 36px; }
  .chip { font-size: 19px; }
}
</style>

<script>
const RAW = `#予備動作
##「合掌の手」
両平手の掌を向かい合わせに軽くつけて、胸の前に立てる

##「イサミの手」
まず、右平手は掌を下向きに、左平手は掌を上向きにして、肩の高さまで上げ、次に、その両平手を腹の脇前まで下げながら掌を返して、前の反対にして、再び肩の高さまで上げる。

##「オサエの手」
両平手の掌を下向きにして、腹の前あたりで、平らに揃える。

##「平らに揃える手」
両平手の掌を上向きにして、胸の前あたりで、小指と小指とを三，四寸離して揃える。。この場合は、そのところで特に説明する。

##「たすけの手」
まず、両平手の掌を内向きにして、頬の前辺りに上げるや、

##「回りの手」
左平手で右袂を軽く押さえ、右平手は掌を外向きにして、左頬の斜め前下あたりに上げる。

##「口許を指す手」
左平手で右袂を軽く押さえ、右人差指は掌を内向きにして、口許を指す。

##「右耳を指す手」
左平手で右袂を軽く押さえ、右人差指は掌を内向きにして、右耳を指す。

##「平らに円を描く手」
両人差指の甲を上向きにし、左指先を少し重ね、腹の前方に突き出すや、直ちに左右に離して、平に円を描き、甲を左右外向きにして、腹のすぐ前に両親指を軽くつけて揃える。


#よろづよ八首

##よろづよの
両平手は、甲を上向きに平らに揃えて、肩の高さまで上げ、右より左へ、左より右へ、右より左へと三回、少し波を打たせ気味にして動かす。足は、左右と二歩進み、左を揃える。（図は「よろ」の型）
##せかい
右平手で、左袂を軽く押さえ、左人差指は、甲を内向きに指先を立てて、肩の高さに上げるや、そのまま直ちに、同じ高さで左方に回すとともに、上半身もそれにつれて左向きとなる（図）。足は、左のみかかとを中心にして、指先を左向きとする。
##一れつ
「回りの手」および「回りの足」（その一）
##みはらせど
左平手で、右袂を軽く押さえ、右平手は、掌を上向きにして、額のあたりへ上げ、前方を見渡す型をする。足は、右左と二歩退り、右を揃える。（図は「みは」の型）
##むねの
両平手の指先を、同時に胸にとる。足は、左を踏む。
##わかりた
両平手は、そのままおもむろに前方に出し、さらに、左右に開いて、指先を斜め外向きにする。足は右左と二歩進む。（図は「りた」の型）
##もの
左右に開いた両平手をみぞおちの前あたりで指先を内向きに返して、そのまま胸の前で掌を上向きに「平らに揃える手」足は、右を揃える。
##はない
右より三回「フリの手」足は右左と二歩下がり、右を揃える。
##そのはずや
左より三回「立てなげの手」足は、左右と二歩進み、左を揃える。
##といて
右人差指で「口許を指す手」足は右を踏む。
##きかした
右人差指で「右耳を指す手」足は、右を左の少し前に踏む。
##こと
上半身を正面に向き直るとともに、両平手の掌を上向きに「平らに揃える手」足は、右を元に戻す。
##ハない
右より三回「フリの手」足は、右左と二歩退り、右を揃える。
##しらぬが
左より三回「フリの手」足は、左右と二歩進み、左を揃える。
##むり
「オサエの手」足は右を踏む。
##でハ
両平手の指先を内向きに返して、掌を上向きに「平らに揃える手」足は、左を踏む。
##ないわいな
右より三回「ナゲの手」足は、右左と二歩退り、右を揃える。
##この
「オサエの手」足は、左を踏む。
##たびは
右より二回「ナゲの手」足は右左と二歩進む。
##かみが
「合掌の手」足は、右を揃える。
##おもてへ
両平手で、額前より胸前に「上下に円を描く手」足は、左右と踏む。
##あらハれて
両平手の掌を上向きにして、下腹の前あたりに、指先を斜め下向きに下げるや、直ちに手首を軽く動かして、少し斜め右前、斜め左前、斜め右前にと三回、物を放り上げる格好をする（図）。足は、右左と二歩退り、右を揃える。
##なにか
「オサエの手」足は、左を踏む。
##いさいを
二回「イサミの手」足は右左と二歩進む。
##とき
右人差指で「口許を指す手」足は、右を揃える。
##き
右人差指で「右耳を指す手」（ただし、動作を早くすること）足は、右を左の少し前に踏む。
##かす
右より二回「ナゲの手」足は、右を大きく一歩退り、左を揃える。
##この
両平手の掌を上向きにして、両胸脇前に平らに出す（図）。足は左を一歩進む。
##とこ
両平手を左右から伏せるようにして「オサエの手」（図）足は、右を一歩進む。
##ろ
両平手の掌を上向きに、左右に開いて、再び、両胸脇前平らに揃える。ただし、「この」よりは少し間隔を狭め気味とする（図）。足は、左を揃える。
##やまとの
上半身はほとんど左向きとなるとともに、両人差指で、額前より胸前に「上下に半円を描く手」（図）足は、右を左の前に踏む。
##ぢばの
上半身は正面向きとなるとともに、両人差指で、腹前に「平らに円を描く手」足は、右を一歩出し、手の動作につれて半分退く。
##かみがたと
「合掌の手」足は右左と二歩退り、右を揃える。
##いうて
右人差指で「口許を指す手」足は、左を踏む。（備考…ここは手と足の動作が反対なり）
##いれども
右より二回「ナゲの手」足は右左と二歩進む。
##もと
「オサエの手」足は、右を揃える。
##しらぬ
右より三回「フリの手」足は、右左と二歩退り、右を揃える。
##このもとを
左より三回「立てなげの手」足は、左右と二歩進み、左を揃える。
##くはしく
右人差指で「口許を指す手」足は右を踏む。
##きいた
右人差指で「右耳を指す手」足は、右を左の少し前に踏む。
##こと
上半身を正面に向き直るとともに、両平手の掌を上向きに「平らに揃える手」足は、右を元に戻す。
##ならバ
右より三回「ナゲの手」足は、右左と二歩退り、右を揃える。
##いかな
上半身を少し左斜めに屈め、両平手の甲を上向きにして、左腰のあたりに下げるや（図）、直ちに上半身を正面向きにするとともに、両平手の掌を外向きにして、指先を立てて、右肩の前あたりに上げる（この時、右手は左手より少し高い＝図）。足は、手の動作につれて、右を左の前から一歩進む（図①②）
##もの
「オサエの手」足は、左を一歩進む（図）。
##でも
右へ一回「ナゲの手」足は、右を揃える（図）。
##こい
両平手の指先を、同時に胸にとる。足は左を踏む。
##しなる
右より三回「ナゲの手」足は、右左と二歩退り、右を揃える。
##きゝ
右人差指で「右耳を指す手」足は、右を左の前に踏む。
##たくバ
右より二回「ナゲの手」足は、右左と二歩進む。
##たづね
右人差指で「前方を指す手」足は、右を揃える。
##くる
左平手は、右袂を軽く押さえたままで、右人差指は掌を内向きにして、胸を指す（図）。足は、左を踏む。（備考…ここは手と足の動作が反対なり）
##なら
右より二回「ナゲの手」足は、右を一歩退り、左を揃える（図①②）。
##いうて
右人差指で「口許を指す手」足は、右を踏む。（図③）。
##きかす
「き」にて、右人差指で「右耳を指す手」足は、右を左の前に踏む（図④）。「かす」にて、右より二回「ナゲの手」足は、右を一歩退り、左を揃える（図⑤⑥）。
##よろづ
「オサエの手」足は、左を踏む。
##いさいの
二回「イサミの手」足は、右左と二歩進む。
##もと
「オサエの手」足は、右を揃える。
##なるを
右より三回「ナゲの手」足は、右左と二歩退り、右を揃える。
##かみ
「合掌の手」足は踏まず。
##が
左脇腹のあたりで「オサエの手」足は、左を踏む。
##でゝ
でゝー両平手は、【三】の「あらわれて」と同じ要領で、掌を前向きにして、下腹の前あたりに、指先を斜め下向きに下げるや、直ちに手首を軽く動かして、少し斜め右前、斜め左前にと二回、物を放り上げる格好をする（図）。足は、右左と二歩進む。
##なにか
「オサエの手」足は、右を揃える。
##いさいを
二回「イサミの手」足は、右左と二歩退る。
##とく
右人差指で「口許を指す手」足は、右を揃える。
##ならバ
右より三回「ナゲの手」足は、右左と二歩進み、右を揃える。
##せかい
手足ともに、【一】の「せかい」と同じ動作。すなわち、右平手で、左袂を軽く押さえ、左人差指は、甲を内向きに指先を立てて、肩の高さに上げるや、そのまま直ちに、同じ高さで左方に回すとともに、上半身もそれにつれて左向きとなる（図）。足は、左のみかかとを中心にして、指先を左向きとする。
##一れつ
一れつー「回りの手」および「回りの足」（その一）
##いさむなり
三回「イサミの手」足は、右左と二歩退り、右を揃える。
##一れつに
「回りの手」および「回りの足」（その一）
##はやく
「オサエの手」をするや、直ちに、指先を内向け返して、掌を上向きにし、胸の前で、両平手の小指と小指とを軽くつけて平らに揃える（図）。足は、右左と踏む。
##たすけを
「たすけの手」足は右左と踏む。
##いそぐから
まず、両平手を軽く握り、右拳は右肩のところに上げ、左拳は左腰の脇に垂れ（図）、次に、なお三回、左右の拳を上下反対にする。足は、右左と二歩進み、右を揃え、左を踏む。
##せかいの
手足ともに、【一】の「せかい」と同じ動作。すなわち、右平手で、左袂を軽く押さえ、左人差指は、甲を内向きに指先を立てて、肩の高さに上げるや、そのまま直ちに、同じ高さで左方に回すとともに、上半身もそれにつれて左向きとなる（図）。足は、左のみかかとを中心にして、指先を左向きとする。
##こゝろも
両平手の指先を、右左と胸にとる。足は、右左と踏む。
##いさめかけ
三回「イサミの手」足は、右左と二歩退り、右を揃える。

/* 体の位置: [中心x, 中心y, 横幅の半分, 縦幅の半分, 呼び名]。人形は正面向きなので、画面の左が人形の右 */
const ZONES = {
  hitai:     [150,  50, 24, 10, '額'],
  mimi_R:    [120,  72,  7, 12, '右耳'],

  mune:      [150, 170, 30, 16, '胸の前'],

  shitahara: [150, 272, 26, 13, '下腹の前'],
  waist_L:   [190, 298, 14, 12, '左腰'],
  waki_L:    [190, 226, 12, 18, '左脇腹'],
  sleeve_R:  [ 90, 252, 15, 24, '右たもと'],
  sleeve_L:  [210, 252, 15, 24, '左たもと'],
  soto_R:    [ 48, 176, 15, 20, '右の外側'],
  soto_L:    [252, 176, 15, 20, '左の外側']
};
const HAND = { R: '右手', L: '左手', B: '両手' };

/* 動作ごとの位置。[場所, 手(R右 L左 B両), 動く順]。足・回数・定義のない動作は扱わない */
const GASSHO = [['mune', 'B']];
const ISAMI  = [['kata_R','R',1],['kata_L','L',1],['hara_R','R',2],['hara_L','L',2],['kata_R','R',3],['kata_L','L',3]];
const OSAE   = [['hara', 'B']];
const TAIRA  = [['mune', 'B']];
const TASUKE = [['hoho_R','R'],['hoho_L','L']];
const MAWARI = [['sleeve_R','L'],['hoho_Ll','R']];
const KUCHI  = [['sleeve_R','L'],['kuchi','R']];
const MIMI   = [['sleeve_R','L'],['mimi_R','R']];
const MUNE   = [['mune','B']];
const SEKAI  = [['sleeve_L','R'],['kata_m','L']];
const HITAI_MUNE = [['hitai','B',1],['mune','B',2]];

const SPEC = [
  ['よろづよの',[['kata_c','B']]], ['せかい',SEKAI], ['一れつ',MAWARI],
  ['みはらせど',[['sleeve_R','L'],['hitai','R']]], ['むねの',MUNE],
  ['わかりた',[['mune','B',1],['soto_R','R',2],['soto_L','L',2]]],
  ['もの',[['mizo','B',1,'flip'],['mune','B',2]]], ['はない',[]],
  ['そのはずや',[]], ['といて',KUCHI], ['きかした',MIMI], ['こと',TAIRA], ['ハない',[]],
  ['しらぬが',[]], ['むり',OSAE], ['でハ',TAIRA], ['ないわいな',[]],
  ['この',OSAE], ['たびは',[]], ['かみが',GASSHO], ['おもてへ',HITAI_MUNE],
  ['あらハれて',[['shitahara','B']]], ['なにか',OSAE], ['いさいを',ISAMI],
  ['とき',KUCHI], ['き',MIMI], ['かす',[]],
  ['この',[['mune_R','R'],['mune_L','L']]], ['とこ',OSAE],
  ['ろ',[['mune_Rn','R'],['mune_Ln','L']]],
  ['やまとの',HITAI_MUNE], ['ぢばの',[['hara','B']]], ['かみがたと',GASSHO],
  ['いうて',KUCHI], ['いれども',[]], ['もと',OSAE], ['しらぬ',[]],
  ['このもとを',[]], ['くはしく',KUCHI], ['きいた',MIMI], ['こと',TAIRA], ['ならバ',[]],
  ['いかな',[['waist_L','B',1],['kata_R','B',2]]], ['もの',OSAE], ['でも',[]],
  ['こい',MUNE], ['しなる',[]], ['きゝ',MIMI], ['たくバ',[]], ['たづね',[]],
  ['くる',[['sleeve_R','L'],['mune','R']]], ['なら',[]], ['いうて',KUCHI], ['きかす',MIMI],
  ['よろづ',OSAE], ['いさいの',ISAMI], ['もと',OSAE], ['なるを',[]],
  ['かみ',GASSHO], ['が',[['waki_L','B']]], ['でゝ',[['shitahara','B']]],
  ['なにか',OSAE], ['いさいを',ISAMI], ['とく',KUCHI], ['ならバ',[]],
  ['せかい',SEKAI], ['一れつ',MAWARI], ['いさむなり',ISAMI], ['一れつに',MAWARI],
  ['はやく',[['hara','B',1,'flipTall'],['mune','B',2]]], ['たすけを',TASUKE],
  ['いそぐから',[['kata_R','R'],['waist_L','L']]], ['せかいの',SEKAI],
  ['こゝろも',MUNE], ['いさめかけ',ISAMI]
];
const VERSE_STARTS = [0, 8, 17, 27, 37, 47, 58, 68];
const VERSE_NAMES = ['一','二','三','四','五','六','七','八'];

function parse(raw) {
  const defs = {}, lyrics = [];
  let section = '', cur = null, inDefs = false;
  for (const line of raw.split(/\r?\n/)) {
    if (/^##/.test(line)) {
      cur = { name: line.replace(/^##/, '').trim(), text: '' };
      if (inDefs) cur.name = cur.name.replace(/[「」]/g, '');
      (inDefs ? Object.assign(defs, { [cur.name]: cur }) : lyrics.push(cur));
    } else if (/^#/.test(line)) {
      section = line.replace(/^#/, '').trim();
      inDefs = section === '予備動作';
      cur = null;
    } else if (cur && line.trim()) {
      cur.text += line.trim();
    }
  }
  return { defs, lyrics };
}
function handText(t) {
  return t
    .replace(/^(でゝ|一れつ)ー/, '')
    .replace(/（備考[^）]*）/g, '')
    .replace(/（図[^）]*）/g, '')
    .replace(/および「回りの足」（その一）/g, '')
    .replace(/手足ともに、/g, '')
    .replace(/足は[^。]*。?/g, '。')
    .replace(/。{2,}/g, '。')
    .replace(/。$/, '');
}
function defText(t) {
  return t.replace(/。。この場合.*$/, '。').replace(/、$/, '…');
}
function merge(spec) {
  const m = new Map();
  for (const [z, h, s, f] of spec) {
    const k = z + '|' + h;
    if (!m.has(k)) m.set(k, { z, h, steps: [], flip: false });
    if (f === 'flip' || f === 'flipTall') m.get(k).flip = f;
    if (s && !m.get(k).steps.includes(s)) m.get(k).steps.push(s);
  }
  return [...m.values()];
}
const DATA = parse(RAW);
DATA.lyrics.forEach((l, i) => {
  l.hand = handText(l.text);
  l.items = merge(SPEC[i] ? SPEC[i][1] : []);
  l.specName = SPEC[i] ? SPEC[i][0] : null;
});
/*--UI--*/
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const L = DATA.lyrics;
const stage = $('#stage');
const mqWide = window.matchMedia('(min-width: 820px)');
let cur = -1;

/* 袂を押さえる手は本筋ではない補助動作として、薄く点線で示す */
const isAux = it => it.z.startsWith('sleeve');
/* 手を返す動作: 位置のまわりに回る矢印を描く */
function flipMark(cx, cy, rx, ry) {
  const rad = d => d * Math.PI / 180;
  const a0 = rad(40), a1 = rad(320);
  const at = a => [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
  const p0 = at(a0), p1 = at(a1);
  let t = [-rx * Math.sin(a1), ry * Math.cos(a1)];
  const len = Math.hypot(t[0], t[1]);
  t = [t[0] / len, t[1] / len];
  const n = [-t[1], t[0]];
  const tip = [p1[0] + t[0] * 8, p1[1] + t[1] * 8];
  const b1 = [p1[0] + n[0] * 4.5, p1[1] + n[1] * 4.5], b2 = [p1[0] - n[0] * 4.5, p1[1] - n[1] * 4.5];
  const f = v => v[0].toFixed(1) + ',' + v[1].toFixed(1);
  return '<path class="flip" d="M' + f(p0) + ' A' + rx + ' ' + ry + ' 0 1 1 ' + f(p1) + '" fill="none"/>' +
         '<polygon class="flipHead" points="' + f(tip) + ' ' + f(b1) + ' ' + f(b2) + '"/>';
}
function badge(cx, cy, label) {
  const w = 8 + 6.5 * label.length;
  return '<rect class="badge" x="' + (cx - w / 2) + '" y="' + (cy - 8) + '" width="' + w + '" height="16" rx="8"/>' +
         '<text class="num" x="' + cx + '" y="' + cy + '">' + esc(label) + '</text>';
}
function zoneSvg(it) {
  const [cx, cy, rx, ry] = ZONES[it.z];
  let s = '<g class="zone ' + it.h + (isAux(it) ? ' aux' : '') + '">' +
    '<ellipse class="glow" cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" filter="url(#glow)"/>' +
    '<ellipse class="ring" cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"/>';
  if (it.flip === 'flipTall') s += flipMark(cx, cy - 26, 11, 29);
  else if (it.flip) s += flipMark(cx, cy - 9, 10, 20);
  if (it.steps.length) s += badge(cx, cy, it.steps.slice().sort().join('・'));
  return s + '</g>';
}
function refsHtml(text) {
  return esc(text).replace(/「([^」]+)」/g, (m, n) =>
    DATA.defs[n] ? '<span class="ref">「' + n + '」</span>' : m);
}
function select(i) {
  if (i < 0 || i >= L.length) return;
  cur = i;
  const l = L[i];
  $('#idx').textContent = (i + 1) + ' / ' + L.length;
  $('#now').textContent = l.name;
  const ordered = [...l.items.filter(it => !isAux(it)), ...l.items.filter(isAux)];
  $('#zones').innerHTML = [...l.items.filter(isAux), ...l.items.filter(it => !isAux(it))].map(zoneSvg).join('');
  $('#rows').innerHTML = ordered.length
    ? ordered.map(it =>
        '<li' + (isAux(it) ? ' class="aux"' : '') + '><span class="sw ' + it.h + '"></span><span class="who">' + HAND[it.h] + '</span>' +
        '<span>' + esc(ZONES[it.z][4]) + '</span><span class="stp">' +
        (isAux(it) ? '補助動作' : (it.steps.length ? esc(it.steps.slice().sort().join('・')) + '番目' : '') + (it.flip ? '・手を返す' : '')) + '</span></li>').join('')
    : '<li class="empty">この歌詞に、位置を指す記述はありません。</li>';
  $('#desc').innerHTML = refsHtml(l.hand);
  const names = [...new Set((l.hand.match(/「([^」]+)」/g) || []).map(s => s.slice(1, -1)))].filter(n => DATA.defs[n]);
  $('#defs').innerHTML = names.map(n => '<li><b>「' + esc(n) + '」</b> ' + esc(defText(DATA.defs[n].text)) + '</li>').join('');
  document.querySelectorAll('.chip').forEach((c, k) => c.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
  syncStageHeight();
}
function syncStageHeight() {
  const h = mqWide.matches ? 0 : stage.offsetHeight;
  document.documentElement.style.setProperty('--stage-h', h + 'px');
}
function buildList() {
  const wrap = $('#verses');
  VERSE_STARTS.forEach((start, v) => {
    const end = VERSE_STARTS[v + 1] ?? L.length;
    const row = document.createElement('section');
    row.className = 'verse';
    row.innerHTML = '<div class="vl">' + VERSE_NAMES[v] + '首</div><div class="chips"></div>';
    const chips = row.querySelector('.chips');
    for (let i = start; i < end; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (L[i].items.length ? '' : ' none');
      b.setAttribute('aria-pressed', 'false');
      const hands = ['R', 'L', 'B'].filter(h => L[i].items.some(it => it.h === h && !isAux(it)));
      b.innerHTML = '<span>' + esc(L[i].name) + '</span><span class="dots">' + hands.map(h => '<i class="' + h + '"></i>').join('') + '</span>';
      b.addEventListener('click', () => select(i));
      chips.appendChild(b);
    }
    wrap.appendChild(row);
  });
}
function step(d) {
  const n = Math.min(L.length - 1, Math.max(0, cur + d));
  select(n);
  const chip = document.querySelectorAll('.chip')[n];
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  chip.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
}
buildList();
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
});
window.addEventListener('resize', syncStageHeight);
select(0);
</script>
